[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bio_collocation"
version = "0.1.0"
description = "Biological collocation analysis package"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Author Name", email = "author@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "cmdstanpy",
    "arviz",
    "numpy",
    "scipy",
    "matplotlib",
    "xarray",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.setuptools]
packages = ["bio_collocation", "bio_collocation.io", "bio_collocation.surrogate", "bio_collocation.collocation", "bio_collocation.plotting", "bio_collocation.stan", "bio_collocation.cli"]
